name: Business Logic Service - Build & Push

on:
  push:
    branches:
      - initial_try

jobs:
  build-and-push:
    name: Build & Push Business Logic Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push business-logic-service
        uses: docker/build-push-action@v5
        with:
          context: ./business-logic-service
          file: ./business-logic-service/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/bookreview-business:latest
            ${{ secrets.DOCKER_USERNAME }}/bookreview-business:${{ github.sha }}
