# Acest fișier merge în repo-ul: andreimitea30/bookreview-io
# Calea: .github/workflows/ci-cd.yml

name: IO Service - Build & Push

on:
  push:
    branches:
      - initial_try

jobs:
  build-and-push:
    name: Build & Push IO Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push io-service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/bookreview-io:latest
            ${{ secrets.DOCKER_USERNAME }}/bookreview-io:${{ github.sha }}

      - name: Build & Push books-db
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./db.Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/bookreview-books-db:latest
            ${{ secrets.DOCKER_USERNAME }}/bookreview-books-db:${{ github.sha }}
