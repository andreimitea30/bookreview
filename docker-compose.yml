services:

  # ── Databases ──────────────────────────────────────────────────────────────

  auth-db:
    image: mariadb:11
    container_name: auth-db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: auth_db
    volumes:
      - auth-db-data:/var/lib/mysql
      - ./auth-service/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - auth-network
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -u root -prootpassword --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  books-db:
    image: mariadb:11
    container_name: books-db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: books_db
    volumes:
      - books-db-data:/var/lib/mysql
      - ./io-service/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -u root -prootpassword --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  # ── DB Admin ───────────────────────────────────────────────────────────────

  adminer:
    image: adminer:4
    container_name: adminer
    ports:
      - "8080:8080"
    networks:
      - auth-network
      - app-network
    depends_on:
      - auth-db
      - books-db

  # ── Microservices ──────────────────────────────────────────────────────────

  auth-service:
    build: ./auth-service
    container_name: auth-service
    environment:
      DB_HOST: auth-db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: rootpassword
      DB_NAME: auth_db
      JWT_SECRET: changeme_in_production
    networks:
      - auth-network
      - gateway-network
    depends_on:
      auth-db:
        condition: service_healthy

  io-service:
    build: ./io-service
    container_name: io-service
    environment:
      DB_HOST: books-db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: rootpassword
      DB_NAME: books_db
    networks:
      - app-network
    depends_on:
      books-db:
        condition: service_healthy

  business-logic-service:
    build: ./business-logic-service
    container_name: business-logic-service
    environment:
      AUTH_SERVICE_URL: http://auth-service:5000
      IO_SERVICE_URL: http://io-service:5001
    networks:
      - app-network
      - gateway-network
    depends_on:
      - auth-service
      - io-service

  # ── Kong API Gateway ───────────────────────────────────────────────────────

  kong:
    image: kong:3.6
    container_name: kong
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
    ports:
      - "8000:8000"   # public proxy
      - "8001:8001"   # admin API (local only)
    volumes:
      - ./kong/kong.yml:/kong/kong.yml
    networks:
      - gateway-network
    depends_on:
      - auth-service
      - business-logic-service

  # ── Monitoring ─────────────────────────────────────────────────────────────

  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - monitoring-network
      - gateway-network
      - app-network
      - auth-network

  grafana:
    image: grafana/grafana:10.4.2
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - monitoring-network
    depends_on:
      - prometheus

  # ── Portainer ──────────────────────────────────────────────────────────────

  portainer:
    image: portainer/portainer-ce:2.20.3
    container_name: portainer
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer-data:/data
    networks:
      - monitoring-network

# ── Networks ───────────────────────────────────────────────────────────────

networks:
  auth-network:
    driver: bridge
  app-network:
    driver: bridge
  gateway-network:
    driver: bridge
  monitoring-network:
    driver: bridge

# ── Volumes ────────────────────────────────────────────────────────────────

volumes:
  auth-db-data:
  books-db-data:
  grafana-data:
  portainer-data:
