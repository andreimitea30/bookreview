_format_version: "3.0"
_transform: true

services:

  - name: auth-service
    url: http://auth-service:5000
    routes:
      - name: auth-routes
        paths:
          - /auth
        strip_path: false

  - name: business-logic-service
    url: http://business-logic-service:5002
    routes:
      - name: api-routes
        paths:
          - /api
        strip_path: false

plugins:
  - name: rate-limiting
    service: auth-service
    config:
      minute: 30
      policy: local
      limit_by: ip

  - name: rate-limiting
    service: business-logic-service
    config:
      minute: 100
      policy: local
      limit_by: ip
